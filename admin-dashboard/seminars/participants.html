<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="../../images/raju-logo.png"><link rel="stylesheet" href="../seminar-admin.css"><title>Participants | Raju Driving School</title><style>.part-page{max-width:950px;margin:auto}.part-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}.part-head h1{font-family:'Space Grotesk';font-size:35px;margin:5px 0}.search{width:100%;height:48px;border:1px solid var(--line);border-radius:13px;padding:0 13px;font:inherit;font-size:12px;outline:none}.part-tools{background:#fff;border:1px solid var(--line);border-radius:20px;padding:13px;margin-bottom:12px}.part-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 12px}.part-stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px 15px}.part-stat b{display:block;font-family:'Space Grotesk';font-size:27px;line-height:1.05}.part-stat span{display:block;color:var(--muted);font-size:9px;margin-top:5px}.part-stat.att b{color:#147348}.part-stat.pending b{color:#a27608}.export-row{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}.export-btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px;font-size:9px;font-weight:900;color:#17344c;cursor:pointer}.export-btn:hover{border-color:#a9c9e4;background:#f7fbff}.export-btn.att{color:#147348;background:#f1fbf5}.export-btn.pending{color:#9b6b00;background:#fff9e9}.filter-row{display:flex;gap:6px;margin-top:9px}.filter-row button{border:0;background:#edf3f6;border-radius:10px;padding:8px 10px;font-size:9px;font-weight:900}.filter-row button.active{background:#eaf3ff;color:#1767ba}.p-list{display:grid;gap:8px}.p-card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px;display:grid;grid-template-columns:45px 1fr auto;gap:10px;align-items:center}.p-seat{width:43px;height:43px;border-radius:13px;background:#eef5fb;display:grid;place-items:center;font-family:'Space Grotesk';font-size:17px;color:#1767ba}.p-main strong{font-size:12px}.p-main small{display:block;color:var(--muted);font-size:9px;margin-top:3px}.p-actions{display:flex;gap:5px}.p-actions button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px;font-size:8px;font-weight:900}.p-actions .cancel{color:#9b6b00;background:#fff7df}.p-actions .delete{color:#a22d2d;background:#fff0f0}.status{font-size:7px;font-weight:900;padding:5px 7px;border-radius:99px;background:#eaf3ff;color:#1767ba}.status.yes{background:#e5f8ed;color:#147348}.status.cancelled{background:#f0f0f0;color:#707070}@media(max-width:700px){.part-summary{grid-template-columns:1fr 1fr 1fr;gap:7px}.part-stat{padding:11px}.part-stat b{font-size:22px}.export-row{display:grid;grid-template-columns:1fr 1fr}.export-btn{min-height:42px}.part-head{align-items:flex-start}.part-head h1{font-size:30px}.p-card{grid-template-columns:43px 1fr}.p-actions{grid-column:1/-1}.p-actions button{flex:1}.filter-row{overflow:auto}}
</style></head><body><header class="admin-mobile-head"><a href="../"><img src="../../images/raju-logo.png"><span><b>RAJU</b><small>SEMINAR ADMIN</small></span></a><button id="logoutTop">Log out</button></header><div class="admin-app"><aside class="admin-side"><div class="side-brand"><img src="../../images/raju-logo.png"><div><b>RAJU DRIVING SCHOOL</b><small>Defensive Driving Seminar</small></div></div><nav><a href="../"><span>⌂</span>Dashboard</a><a href="attendance.html"><span>▣</span>QR Attendance</a><a class="active" href="participants.html"><span>♙</span>Participants</a></nav><div class="side-foot"><a href="../../defensive-driving-seminar/" target="_blank">↗ Public booking page</a><button id="logoutSide">Log out</button></div></aside><main class="admin-main"><div class="part-page"><div class="part-head"><div><a class="back" href="./" style="color:var(--blue);text-decoration:none;font-size:10px;font-weight:900">← Seminar sessions</a><h1>Participants</h1></div></div><div class="part-summary"><div class="part-stat"><b id="countAll">—</b><span>Total booked</span></div><div class="part-stat att"><b id="countAttended">—</b><span>Attended</span></div><div class="part-stat pending"><b id="countPending">—</b><span>Not attended</span></div></div><div class="export-row"><button class="export-btn" id="exportAll">↓ Download all participants PDF</button><button class="export-btn att" id="exportAttended">↓ Download attended PDF</button><button class="export-btn pending" id="exportPending">↓ Download not attended PDF</button></div><div class="part-tools"><input id="search" class="search" placeholder="Search participant name, mobile or booking ID…"><div class="filter-row"><button class="active" data-filter="all">All</button><button data-filter="confirmed">Not attended</button><button data-filter="attended">Attended</button></div></div><div id="list" class="p-list"><div class="empty-admin">Loading participants…</div></div></div></main></div><nav class="admin-mobile-nav"><a href="../"><span>⌂</span>Home</a><a href="attendance.html"><span>▣</span>Scan</a><a class="active" href="participants.html"><span>♙</span>People</a><a href="../../defensive-driving-seminar/" target="_blank"><span>↗</span>Booking</a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="../../student-config.js"></script><script src="../admin-core.js"></script><script src="../shell.js"></script><script>(()=>{const db=window.RajuAdmin.client,$=id=>document.getElementById(id);let ev=null,rows=[],filter='all';function esc(s){return window.RajuAdmin.esc(s)}async function load(){if(!(await window.RajuAdmin.guard()))return;const requestedId=new URLSearchParams(location.search).get('id');let data=null;if(requestedId){const q=await db.from('seminar_events').select('*').eq('id',requestedId).maybeSingle();data=q.data?[q.data]:[]}else{const q=await db.rpc('active_seminar_events');data=q.data||[]}if(!data?.length)return;ev=data[0];const q=await db.from('seminar_registrations').select('id,full_name,phone,email,booking_code,seat_number,status,registered_at,attended_at').eq('event_id',ev.id).order('seat_number',{ascending:true});rows=q.data||[];updateCounts();render()}function updateCounts(){const active=rows.filter(r=>r.status!=='cancelled');$('countAll').textContent=active.length;$('countAttended').textContent=active.filter(r=>r.status==='attended').length;$('countPending').textContent=active.filter(r=>r.status==='confirmed').length}function render(){const term=$('search').value.trim().toLowerCase();const filtered=rows.filter(r=>(filter==='all'||r.status===filter)&&(!term||[r.full_name,r.phone,r.booking_code].join(' ').toLowerCase().includes(term)));$('list').innerHTML=filtered.length?filtered.map(r=>`<article class="p-card"><div class="p-seat">${String(r.seat_number).padStart(2,'0')}</div><div class="p-main"><span class="status ${r.status==='attended'?'yes':r.status==='cancelled'?'cancelled':''}">${r.status==='attended'?'Attended':r.status==='cancelled'?'Cancelled':'Not attended'}</span><strong>${esc(r.full_name)}</strong><small>${esc(r.phone)} · ${esc(r.booking_code)}${r.email?' · '+esc(r.email):''}</small></div><div class="p-actions">${r.status==='confirmed'?`<button class="cancel" data-cancel="${r.id}">Cancel</button>`:''}<button class="delete" data-delete="${r.id}">Delete</button></div></article>`).join(''):'<div class="empty-admin">No matching participants.</div>';document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>cancel(b.dataset.cancel));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>del(b.dataset.delete))}async function exportPDF(kind){const active=rows.filter(r=>r.status!=='cancelled');let data,title,fileKind;if(kind==='all'){data=active;title='All Participants';fileKind='all'}else if(kind==='attended'){data=active.filter(r=>r.status==='attended');title='Attended Participants';fileKind='attended'}else{data=active.filter(r=>r.status==='confirmed');title='Not Attended Participants';fileKind='not-attended'}if(!data.length){alert(kind==='all'?'No participants to export yet.':kind==='attended'?'No attended participants to export yet.':'No not-attended participants to export.');return}if(!window.jspdf?.jsPDF){alert('PDF generator is still loading. Please try again.');return}const {jsPDF}=window.jspdf;const doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});doc.setFont('helvetica','bold');doc.setFontSize(18);doc.text('RAJU DRIVING SCHOOL',14,16);doc.setFontSize(13);doc.text('Defensive Driving Seminar — '+title,14,24);doc.setFont('helvetica','normal');doc.setFontSize(9);doc.text(`Session: ${ev?.title||'Defensive Driving Seminar'} | Date: ${ev?.event_date||'—'} | Time: ${ev?.start_time||'—'}${ev?.end_time?' - '+ev.end_time:''}`,14,31);doc.text(`Total participants: ${data.length}`,14,37);let y=46;const cols=[['S.No.',14],['Seat',32],['Participant name',55],['Mobile',135],['Booking date',178],['Attendance',235]];function header(){doc.setFillColor(6,26,45);doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');cols.forEach(([t,x])=>doc.text(t,x,y));y+=7;doc.setTextColor(16,43,67);doc.setFont('helvetica','normal')}header();data.forEach((r,i)=>{if(y>190){doc.addPage();y=18;header()}const bookingDate=r.registered_at?new Date(r.registered_at).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}):'—';const status=r.status==='attended'?'Attended':'Not attended';const vals=[String(i+1),String(r.seat_number??'—'),String(r.full_name||'').slice(0,42),String(r.phone||'—'),bookingDate,status];[14,32,55,135,178,235].forEach((x,j)=>doc.text(vals[j],x,y));y+=7});doc.setFontSize(8);doc.setTextColor(110,120,130);doc.text('Generated by Raju Driving School Seminar Admin',14,202);doc.save(`raju-driving-school-${fileKind}-participants-${ev?.event_date||'seminar'}.pdf`)}async function cancel(id){if(!confirm('Cancel this booking? The seat will be released.'))return;const {error}=await db.from('seminar_registrations').update({status:'cancelled',cancelled_at:new Date().toISOString()}).eq('id',id);if(error)return alert(error.message);await load()}async function del(id){const r=rows.find(x=>x.id===id);if(!r||!confirm(`Permanently delete ${r.full_name}? This cannot be undone.`))return;const {error}=await db.from('seminar_registrations').delete().eq('id',id);if(error)return alert(error.message);await load()}$('exportAll').onclick=()=>exportPDF('all');$('exportAttended').onclick=()=>exportPDF('attended');$('exportPending').onclick=()=>exportPDF('pending');$('search').oninput=render;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});$('logoutSide').onclick=$('logoutTop').onclick=async()=>{await db.auth.signOut();location.href='../../admin/'};load()})();</script></body></html>
