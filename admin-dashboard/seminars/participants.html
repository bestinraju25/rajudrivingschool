<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="../../images/raju-logo.png"><link rel="stylesheet" href="../seminar-admin.css"><title>Participants | Raju Driving School</title><style>.part-page{max-width:950px;margin:auto}.part-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}.part-head h1{font-family:'Space Grotesk';font-size:35px;margin:5px 0}.search{width:100%;height:48px;border:1px solid var(--line);border-radius:13px;padding:0 13px;font:inherit;font-size:12px;outline:none}.part-tools{background:#fff;border:1px solid var(--line);border-radius:20px;padding:13px;margin-bottom:12px}.filter-row{display:flex;gap:6px;margin-top:9px}.filter-row button{border:0;background:#edf3f6;border-radius:10px;padding:8px 10px;font-size:9px;font-weight:900}.filter-row button.active{background:#eaf3ff;color:#1767ba}.p-list{display:grid;gap:8px}.p-card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px;display:grid;grid-template-columns:45px 1fr auto;gap:10px;align-items:center}.p-seat{width:43px;height:43px;border-radius:13px;background:#eef5fb;display:grid;place-items:center;font-family:'Space Grotesk';font-size:17px;color:#1767ba}.p-main strong{font-size:12px}.p-main small{display:block;color:var(--muted);font-size:9px;margin-top:3px}.p-actions{display:flex;gap:5px}.p-actions button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px;font-size:8px;font-weight:900}.p-actions .cancel{color:#9b6b00;background:#fff7df}.p-actions .delete{color:#a22d2d;background:#fff0f0}.status{font-size:7px;font-weight:900;padding:5px 7px;border-radius:99px;background:#eaf3ff;color:#1767ba}.status.yes{background:#e5f8ed;color:#147348}.status.cancelled{background:#f0f0f0;color:#707070}@media(max-width:700px){.part-head{align-items:flex-start}.part-head h1{font-size:30px}.p-card{grid-template-columns:43px 1fr}.p-actions{grid-column:1/-1}.p-actions button{flex:1}.filter-row{overflow:auto}}
</style></head><body><header class="admin-mobile-head"><a href="../"><img src="../../images/raju-logo.png"><span><b>RAJU</b><small>SEMINAR ADMIN</small></span></a><button id="logoutTop">Log out</button></header><div class="admin-app"><aside class="admin-side"><div class="side-brand"><img src="../../images/raju-logo.png"><div><b>RAJU DRIVING SCHOOL</b><small>Defensive Driving Seminar</small></div></div><nav><a href="../"><span>⌂</span>Dashboard</a><a href="attendance.html"><span>▣</span>QR Attendance</a><a class="active" href="participants.html"><span>♙</span>Participants</a></nav><div class="side-foot"><a href="../../defensive-driving-seminar/" target="_blank">↗ Public booking page</a><button id="logoutSide">Log out</button></div></aside><main class="admin-main"><div class="part-page"><div class="part-head"><div><a class="back" href="../" style="color:var(--blue);text-decoration:none;font-size:10px;font-weight:900">← Seminar dashboard</a><h1>Participants</h1></div></div><div class="part-tools"><input id="search" class="search" placeholder="Search participant name, mobile or booking ID…"><div class="filter-row"><button class="active" data-filter="all">All</button><button data-filter="confirmed">Not attended</button><button data-filter="attended">Attended</button></div></div><div id="list" class="p-list"><div class="empty-admin">Loading participants…</div></div></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../student-config.js"></script><script src="../admin-core.js"></script><script src="../shell.js"></script><script>(()=>{const db=window.RajuAdmin.client,$=id=>document.getElementById(id);let ev=null,rows=[],filter='all';function esc(s){return window.RajuAdmin.esc(s)}async function load(){if(!(await window.RajuAdmin.guard()))return;const {data}=await db.rpc('active_seminar_events');if(!data?.length)return;ev=data[0];const q=await db.from('seminar_registrations').select('id,full_name,phone,email,booking_code,seat_number,status,registered_at,attended_at').eq('event_id',ev.id).order('seat_number',{ascending:true});rows=q.data||[];render()}function render(){const term=$('search').value.trim().toLowerCase();const filtered=rows.filter(r=>(filter==='all'||r.status===filter)&&(!term||[r.full_name,r.phone,r.booking_code].join(' ').toLowerCase().includes(term)));$('list').innerHTML=filtered.length?filtered.map(r=>`<article class="p-card"><div class="p-seat">${String(r.seat_number).padStart(2,'0')}</div><div class="p-main"><span class="status ${r.status==='attended'?'yes':r.status==='cancelled'?'cancelled':''}">${r.status==='attended'?'Attended':r.status==='cancelled'?'Cancelled':'Not attended'}</span><strong>${esc(r.full_name)}</strong><small>${esc(r.phone)} · ${esc(r.booking_code)}${r.email?' · '+esc(r.email):''}</small></div><div class="p-actions">${r.status==='confirmed'?`<button class="cancel" data-cancel="${r.id}">Cancel</button>`:''}<button class="delete" data-delete="${r.id}">Delete</button></div></article>`).join(''):'<div class="empty-admin">No matching participants.</div>';document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>cancel(b.dataset.cancel));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>del(b.dataset.delete))}async function cancel(id){if(!confirm('Cancel this booking? The seat will be released.'))return;const {error}=await db.from('seminar_registrations').update({status:'cancelled',cancelled_at:new Date().toISOString()}).eq('id',id);if(error)return alert(error.message);await load()}async function del(id){const r=rows.find(x=>x.id===id);if(!r||!confirm(`Permanently delete ${r.full_name}? This cannot be undone.`))return;const {error}=await db.from('seminar_registrations').delete().eq('id',id);if(error)return alert(error.message);await load()}$('search').oninput=render;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});$('logoutSide').onclick=$('logoutTop').onclick=async()=>{await db.auth.signOut();location.href='../../admin/'};load()})();</script></body></html>
