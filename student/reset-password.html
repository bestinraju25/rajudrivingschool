<!DOCTYPE html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="../images/raju-logo.png"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../student-auth.css"><title>Reset Password | Raju Driving School</title></head><body class="student-auth-page"><header class="nav auth-nav"><a class="brand" href="../"><img class="brand-logo" src="../images/raju-logo.png" alt="Raju Driving School"></a><a class="auth-home-link" href="./">← Student login</a></header><main class="auth-shell"><section class="auth-intro"><span class="auth-kicker">STUDENT PORTAL</span><h1>Choose a new<br><em>password.</em></h1><p>Use the secure link from your email to set a new password for your student account.</p></section><section class="auth-card"><form id="resetForm" class="auth-form active"><div class="auth-form-head"><span>RESET PASSWORD</span><h2>New password</h2><p>Enter your new password below.</p></div><div id="resetMessage" class="auth-message"></div><label>New password<input id="password" type="password" minlength="8" autocomplete="new-password" required placeholder="At least 8 characters"></label><label>Confirm password<input id="confirm" type="password" minlength="8" autocomplete="new-password" required placeholder="Repeat your password"></label><button class="auth-submit" type="submit">Update password <span>↗</span></button></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../student-config.js"></script><script>const c=supabase.createClient(window.RAJU_SUPABASE_URL,window.RAJU_SUPABASE_ANON_KEY),f=document.getElementById('resetForm'),m=document.getElementById('resetMessage'); f.addEventListener('submit',async e=>{e.preventDefault();m.className='auth-message';m.textContent='';const a=document.getElementById('password').value,b=document.getElementById('confirm').value;if(a!==b){m.className='auth-message error';m.textContent='Passwords do not match.';return}const {error}=await c.auth.updateUser({password:a});if(error){m.className='auth-message error';m.textContent=error.message;return}m.className='auth-message success';m.textContent='Password updated. You can now log in.';setTimeout(()=>location.href='./',1200)});</script></body></html>
