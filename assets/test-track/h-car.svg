<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" role="img" aria-labelledby="title desc">
<title id="title">H test track for car and LMV</title>
<desc id="desc">H-shaped test track with route A to B, B to C, C to D and D back to A.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0757c9"/></marker></defs>
<rect width="600" height="430" rx="28" fill="#f7f9fc"/>
<path d="M120 365V65 M480 65V365 M120 215H480" fill="none" stroke="#f4d11e" stroke-width="104" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M120 365V65 M480 65V365 M120 215H480" fill="none" stroke="#272b31" stroke-width="92" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M120 365V65 M480 65V365 M120 215H480" fill="none" stroke="#aeb6c0" stroke-width="5" stroke-dasharray="24 22" stroke-linecap="round"/>
<path d="M120 315V100" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M160 215H440" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M480 115V335" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M440 215H160" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)" opacity=".9"/>
<g font-family="Manrope,Arial,sans-serif" font-weight="900" font-size="27" fill="#f4d11e"><text x="74" y="397">A</text><text x="72" y="45">B</text><text x="493" y="397">C</text><text x="492" y="45">D</text></g>
<g font-family="DM Sans,Arial,sans-serif" font-size="11" font-weight="900" fill="#fff"><rect x="83" y="325" width="74" height="24" rx="12" fill="#0757c9"/><text x="120" y="341" text-anchor="middle">START · A</text></g>
</svg>
