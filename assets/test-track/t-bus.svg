<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" role="img" aria-labelledby="title desc">
<title id="title">T test track for bus and heavy vehicle</title>
<desc id="desc">T-shaped test track with route A to B, B to C, C to D and D to E.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0757c9"/></marker></defs>
<rect width="600" height="430" rx="28" fill="#f7f9fc"/>
<path d="M170 365V75 M170 215H500" fill="none" stroke="#f4d11e" stroke-width="104" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M170 365V75 M170 215H500" fill="none" stroke="#272b31" stroke-width="92" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M170 365V75 M170 215H500" fill="none" stroke="#aeb6c0" stroke-width="5" stroke-dasharray="24 22" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M170 335V105" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M205 215H465" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M500 250H205" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M170 245V335" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
<g font-family="Manrope,Arial,sans-serif" font-weight="900" font-size="27" fill="#f4d11e"><text x="126" y="397">A</text><text x="124" y="45">B</text><text x="505" y="200">C</text><text x="126" y="255">D</text><text x="505" y="247">E</text></g>
<g font-family="DM Sans,Arial,sans-serif" font-size="11" font-weight="900" fill="#fff"><rect x="133" y="325" width="74" height="24" rx="12" fill="#0757c9"/><text x="170" y="341" text-anchor="middle">START · A</text></g>
</svg>
